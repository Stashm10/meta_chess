<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta Chess</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>Meta Chess</h1>
  <span id="status" class="pill" data-status="idle">idle</span>
  <span id="color" class="muted"></span>
  <span id="visible" class="muted"></span>
  <span id="conn" class="conn" title="Dashboard connection">●</span>
</header>

<main>
  <section class="card board-card">
    <div class="card-head">
      <h2>Game</h2>
      <span id="fen" class="mono muted small"></span>
    </div>
    <div id="board" class="board"></div>
  </section>

  <section class="card side">
    <div class="best">
      <div class="label">Best move</div>
      <div id="best" class="best-move">—</div>
      <div id="spoken" class="muted"></div>
    </div>
    <div class="controls">
      <button id="btn-new" class="primary">New game</button>
      <select id="new-color" title="Your color">
        <option value="">Auto color</option>
        <option value="white">White</option>
        <option value="black">Black</option>
      </select>
      <button id="btn-repeat">Repeat</button>
      <button id="btn-undo">Undo last move</button>
      <button id="btn-recal">Recalibrate</button>
      <button id="btn-end">End game</button>
      <button id="btn-test">Test voice</button>
    </div>
    <div class="label">Moves</div>
    <ol id="moves" class="moves"></ol>
    <div id="pgn" class="muted small"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>Camera</h2><span id="confidence" class="muted small"></span></div>
    <div class="camera" id="camera-box">
      <img id="camera" alt="Latest captured frame" hidden>
      <span id="camera-empty">No capture running.</span>
    </div>
    <div id="vision-note" class="small vision-note"></div>
    <div id="capture-status" class="small muted capture-status"></div>
    <div id="capture-error" class="small warn" hidden></div>
    <div class="controls">
      <select id="source" title="Frame source">
        <option value="phone">iPhone app (glasses)</option>
        <option value="window">Messenger window (auto)</option>
        <option value="region">Screen region</option>
        <option value="file">Video / image folder</option>
      </select>
      <button id="btn-capture" class="primary">Start capture</button>
      <label class="check"><input id="record" type="checkbox"> Record</label>
    </div>
    <div id="source-region" class="row" hidden>
      <input id="region" type="text" placeholder="x, y, width, height (screen points)">
    </div>
    <div id="source-file" hidden>
      <div class="row"><input id="file-path" type="text" placeholder="recordings/glasses-test/game1.mov"></div>
      <label class="check small"><input id="call-quality" type="checkbox" checked> Degrade to call quality (720p)</label>
      <label class="check small"><input id="loop" type="checkbox"> Loop</label>
    </div>
    <div class="label">What vision sees</div>
    <div id="observed" class="grid"></div>
  </section>

  <details class="card">
    <summary class="card-head"><h2>Fake vision</h2><span class="muted small">for testing: click squares, empty → white → black</span></summary>
    <div id="fake" class="grid editable"></div>
    <div class="controls">
      <button id="btn-load">Load current position</button>
      <button id="btn-start">Starting position</button>
      <button id="btn-send" class="primary">Send ×<span id="stable">3</span></button>
      <button id="btn-noboard">Look away</button>
    </div>
  </details>

  <section class="card">
    <div class="card-head"><h2>Settings</h2></div>
    <label class="field">Speak moves on
      <select id="speak-on">
        <option value="phone">iPhone (into the glasses)</option>
        <option value="mac">This Mac</option>
        <option value="both">Both</option>
      </select>
    </label>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
